name: René build

on:
  push:
    branches:
      - "rene/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: "0"
      GOFLAGS: "-mod=vendor"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test account API conversion
        run: go test -tags="netgo osusergo static_build kvformat timetzdata" -timeout=20m ./internal/typeutils

      - name: Build Linux AMD64 binary
        env:
          GOOS: linux
          GOARCH: amd64
          VERSION: 0.22.0-rene
        run: ./scripts/build.sh

      - name: Package deployable archive
        run: |
          mkdir -p dist/gotosocial
          cp gotosocial LICENSE README.md example/config.yaml example/gotosocial.service dist/gotosocial/
          cp -R web/assets web/template dist/gotosocial/
          tar -C dist -czf dist/gotosocial_0.22.0-rene_linux_amd64.tar.gz gotosocial

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: gotosocial-0.22.0-rene-linux-amd64
          path: dist/gotosocial_0.22.0-rene_linux_amd64.tar.gz
          if-no-files-found: error
          retention-days: 30
