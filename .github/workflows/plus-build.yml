name: GoToSocial Plus build

on:
  push:
    branches:
      - "plus/**"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Exact release version, for example 0.22.1-plus.4 (leave empty for a development build)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gotosocial_test
          POSTGRES_USER: gotosocial
          POSTGRES_PASSWORD: gotosocial
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gotosocial -d gotosocial_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CGO_ENABLED: "0"
      GOFLAGS: "-mod=vendor"
      PLUS_BASE_VERSION: "0.22.1"
      PLUS_DEV_RELEASE: "5"
      GTS_TEST_POSTGRES_DSN: "postgres://gotosocial:gotosocial@localhost:5432/gotosocial_test?sslmode=disable"

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: web/source/yarn.lock

      - name: Build web assets
        working-directory: web/source
        run: |
          yarn install --frozen-lockfile
          yarn ts-patch install
          yarn build

      - name: Verify deployable web assets
        run: |
          test -f web/assets/dist/base.css
          test -f web/assets/dist/settings.js

      - name: Compute build version
        shell: bash
        run: |
          requested_version="${{ inputs.release_version }}"
          if [[ -n "${requested_version}" ]]
          then
            if [[ "${GITHUB_REF_NAME}" != "plus/v${PLUS_BASE_VERSION}" ]]
            then
              echo "Release builds must run from plus/v${PLUS_BASE_VERSION}." >&2
              exit 1
            fi
            if [[ ! "${requested_version}" =~ ^${PLUS_BASE_VERSION}-plus\.[0-9]+$ ]]
            then
              echo "Invalid release version: ${requested_version}" >&2
              exit 1
            fi
            build_version="${requested_version}"
          else
            build_version="${PLUS_BASE_VERSION}-plus.${PLUS_DEV_RELEASE}-dev+git-${GITHUB_SHA:0:9}"
          fi
          echo "BUILD_VERSION=${build_version}" >> "${GITHUB_ENV}"
          echo "BUILD_ARCHIVE=gotosocial_${build_version}_linux_amd64.tar.gz" >> "${GITHUB_ENV}"

      - name: Test Plus behavior
        shell: bash
        run: |
          test_log="$(mktemp)"
          trap 'rm -f "${test_log}"' EXIT
          if ! go test -tags="netgo osusergo static_build kvformat timetzdata" -timeout=20m \
            ./internal/api/client/interactionrequests \
            ./internal/api/client/instance \
            ./internal/api/util \
            ./internal/bluesky \
            ./internal/cleaner \
            ./internal/config \
            ./internal/db/bundb \
            ./internal/db/bundb/migrations \
            ./internal/federation/dereferencing \
            ./internal/federation/federatingdb \
            ./internal/filter/interaction \
            ./internal/middleware \
            ./internal/processing \
            ./internal/processing/interactionrequests \
            ./internal/processing/workers \
            ./internal/typeutils \
            ./internal/web >"${test_log}" 2>&1
          then
            sed '/func=bundb.queryLogger/d' "${test_log}" |
              cut -c1-2000 |
              tail -n 500
            exit 1
          fi
          tail -n 20 "${test_log}"

      - name: Build Linux AMD64 binary
        env:
          GOOS: linux
          GOARCH: amd64
        run: VERSION="${BUILD_VERSION}" ./scripts/build.sh

      - name: Package deployable archive
        run: |
          mkdir -p dist/gotosocial
          cp gotosocial LICENSE README.md CHANGELOG.md GOTOSOCIAL_PLUS.md example/config.yaml example/gotosocial.service dist/gotosocial/
          cp -R web/assets web/template dist/gotosocial/
          tar -C dist -czf "dist/${BUILD_ARCHIVE}" gotosocial

      - name: Upload build
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gotosocial-${{ env.BUILD_VERSION }}-linux-amd64
          path: dist/${{ env.BUILD_ARCHIVE }}
          if-no-files-found: error
          retention-days: 30
