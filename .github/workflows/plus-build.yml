name: GoToSocial Plus build

on:
  push:
    branches:
      - "plus/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: "0"
      GOFLAGS: "-mod=vendor"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: web/source/yarn.lock

      - name: Build web assets
        working-directory: web/source
        run: |
          yarn install --frozen-lockfile
          yarn ts-patch install
          yarn build

      - name: Verify deployable web assets
        run: |
          test -f web/assets/dist/base.css
          test -f web/assets/dist/settings.js

      - name: Test account API conversion
        run: go test -tags="netgo osusergo static_build kvformat timetzdata" -timeout=20m ./internal/config ./internal/middleware ./internal/typeutils ./internal/web

      - name: Build Linux AMD64 binary
        env:
          GOOS: linux
          GOARCH: amd64
          VERSION: 0.22.1-plus.3
        run: ./scripts/build.sh

      - name: Package deployable archive
        run: |
          mkdir -p dist/gotosocial
          cp gotosocial LICENSE README.md CHANGELOG.md GOTOSOCIAL_PLUS.md example/config.yaml example/gotosocial.service dist/gotosocial/
          cp -R web/assets web/template dist/gotosocial/
          tar -C dist -czf dist/gotosocial_0.22.1-plus.3_linux_amd64.tar.gz gotosocial

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: gotosocial-0.22.1-plus.3-linux-amd64
          path: dist/gotosocial_0.22.1-plus.3_linux_amd64.tar.gz
          if-no-files-found: error
          retention-days: 30
